# The expensive half of the harness.
#
# Separate from ci.yml because these jobs are minutes-to-an-hour, not seconds,
# and nothing here should sit between a push and a merge.
#
# What runs here: everything that needs Dolphin's libraries built but NOT the
# game disc.
#
#   native-differential      coreboot (Core/PowerPC/IOS/DiscIO bring-up, 67
#                            assertions) and tracetest (instruction-level
#                            trace, native vs the expected sequence)
#   recompiler-differential  the four differentials in jitdiff.cpp, which
#                            compare compiled blocks against the interpreter
#                            in the same process
#
# bootgame and the FIFO capture need a 4.7 GB copyrighted disc that cannot be
# provided to a hosted runner, so they stay manual -- which means the SPEED
# numbers are still measured by hand. Correctness is not.
#
# STATUS: unverified. This has not completed a run on a hosted runner yet --
# the Dolphin build has a long dependency list and the first run is where that
# gets found out. ci.yml is the workflow that currently gates anything.
name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  # A manual run can pick one job. The native differential needs a macOS
  # runner, which bills at ten times a Linux one, and verifying a change to
  # the wasm job should not cost ninety minutes of that.
  workflow_dispatch:
    inputs:
      jobs:
        description: which jobs to run
        default: all
        type: choice
        options: [all, native, recompiler]

jobs:
  native-differential:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.jobs == 'all' || inputs.jobs == 'native'
    name: native differential (no disc)
    # macOS, not Linux. harness/wasm-core/link-native.sh names the static
    # libraries it links explicitly, and that list includes libvideometal.a,
    # which exists only on macOS. More importantly the oracle has to match the
    # one the harness is developed against: a differential whose reference is
    # built by a different toolchain on a different platform is comparing two
    # unknowns.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: clone Dolphin
        # dolphin/ is gitignored here rather than vendored, so CI fetches it
        # and applies the same patches a local checkout uses.
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/dolphin-emu/dolphin.git dolphin

      - name: apply patches
        # Not a plain loop over the patch directory: 0003 patches SFML, which
        # is a submodule, so its paths are relative to the submodule root. A
        # top-level loop fails on it, which is exactly how the first nightly
        # run failed. scripts/apply-patches.sh owns that mapping so CI and a
        # human checkout cannot diverge.
        run: scripts/apply-patches.sh dolphin

      - name: build dependencies
        # Dolphin vendors its Externals, so macOS needs little beyond the
        # toolchain Xcode already provides.
        # fmt matters beyond "it is a dependency": Dolphin's CMake picks up
        # Homebrew's fmt when it is present, so libcore gets compiled against
        # those headers. link-native.sh then has to use the SAME ones, or the
        # harness and libcore disagree about a type that crosses between them
        # -- an ODR violation that links cleanly and misbehaves at runtime.
        # Installing it here makes CI match the development machine.
        #
        # The rest of the list is link-native.sh's -l flags, minus what the
        # macOS SDK already provides (bz2, curl, iconv, resolv). Discovering
        # them one failed run at a time costs ten minutes of Dolphin build per
        # missing library, so they go in together.
        run: |
          brew install cmake ninja pkg-config fmt ffmpeg lzo zstd lz4 xz xxhash libusb

      - name: configure (ENABLE_GENERIC, matching link-native.sh)
        # ENABLE_GENERIC is not a preference: wasm cannot JIT, so the oracle
        # has to be the interpreter too or the differential compares two
        # different execution engines.
        run: |
          cmake -S dolphin -B dolphin-web/build-native-generic -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_GENERIC=ON \
            -DENABLE_QT=OFF -DENABLE_NOGUI=OFF -DENABLE_TESTS=OFF \
            -DENABLE_AUTOUPDATE=OFF -DENABLE_ANALYTICS=OFF -DENABLE_LTO=OFF \
            -DUSE_MGBA=OFF -DUSE_RETRO_ACHIEVEMENTS=OFF \
            -DUSE_DISCORD_PRESENCE=OFF -DENABLE_VULKAN=OFF -DENABLE_SDL=OFF

      - name: build libraries
        # Everything, not just libcore. link-native.sh links a fixed list of
        # static libraries -- VideoCommon, the backends, DiscIO, InputCommon,
        # UICommon and a dozen Externals -- and building only libcore leaves
        # the link failing on a dozen missing archives. With Qt, NoGUI and
        # tests all off, "everything" is those libraries plus dolphin-tool.
        run: ninja -C dolphin-web/build-native-generic

      - name: coreboot differential
        run: |
          harness/wasm-core/link-native.sh harness/wasm-core/coreboot.cpp /tmp/coreboot
          /tmp/coreboot

      - name: instruction trace
        run: |
          harness/wasm-core/link-native.sh harness/wasm-core/tracetest.cpp /tmp/tracetest
          /tmp/tracetest > /tmp/trace.txt
          grep -c '^T ' /tmp/trace.txt

  recompiler-differential:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.jobs == 'all' || inputs.jobs == 'recompiler'
    name: recompiler differentials (wasm, no disc)
    # The four differentials in harness/wasm-core/jitdiff.cpp: hand-written
    # cases, a randomised per-instruction differential, a randomised block
    # differential including guest memory, and a randomised CHAIN
    # differential that links blocks and runs them.
    #
    # These are the project's main correctness gate for the recompiler and
    # until now they ran only when someone remembered. They need no disc --
    # only Emscripten and Dolphin's libraries built for wasm32 -- so there
    # is no reason they cannot run unattended. They do not go in ci.yml
    # because the Dolphin build is the better part of an hour and nothing
    # that slow belongs between a push and a merge.
    #
    # Linux, unlike the native job above. That one needs macOS because
    # link-native.sh links libvideometal.a; link.sh does not, and a wasm
    # build is the same on either host because the target is wasm32.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: clone Dolphin
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/dolphin-emu/dolphin.git dolphin

      - name: apply patches
        run: scripts/apply-patches.sh dolphin

      - name: install Emscripten
        # Installed by hand into ~/emsdk rather than through a third-party
        # action, because that is the path scripts/build-wasm.sh and
        # harness/wasm-core/link.sh already look in when EMSDK is unset. CI
        # and a local checkout then run the same scripts unmodified.
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: build Dolphin for wasm32
        # The libraries link.sh names, by target, and NOT `all`.
        #
        # scripts/build-wasm.sh defaults to `common`, which is right for
        # someone iterating on the port and wrong here -- the first run of
        # this job died on "libcore.a: No such file or directory" having
        # built one library. `all` was the obvious correction and is also
        # wrong: it includes dolphin-tool, an executable that does not link
        # for wasm32 because libusb has no backend and Thread.cpp wants
        # pthread_setname_np. The libraries build; only the executables do
        # not, and nothing here needs an executable.
        run: >-
          scripts/build-wasm.sh core videocommon videonull videosoftware
          videoogl audiocommon inputcommon discio uicommon common

      - name: the four differentials
        # run-jitdiff.sh builds jitdiff.cpp against those libraries and runs
        # it under node. Its exit status is the suite's -- a differential
        # that fails returns non-zero, and so does one that fails its own
        # coverage assertions, which is the point of having them.
        run: harness/wasm-core/run-jitdiff.sh

      - name: the four differentials, as the game compiles
        # The same suite with the slow paths as helper calls, the float
        # conversions through promote/demote, the paired singles as
        # vectors, the warm entry, the cold branches hinted and the access
        # groups -- the dispatcher's defaults, all meant to be exact. The
        # module is the one the step above built.
        run: node --max-old-space-size=8192 --expose-gc /tmp/jitdiff.js --compact --short-convert --simd --warm --hints --groups
