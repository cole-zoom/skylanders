# Fast checks that gate every push.
#
# Deliberately scoped to what needs NO game disc, NO Emscripten toolchain and
# NO browser. Those three are what make the rest of this project's testing
# expensive: the differential harness needs a 4.7 GB copyrighted disc that
# cannot live in a repo, the wasm link alone takes about seven minutes, and a
# deep capture run takes billions of interpreted instructions.
#
# So this workflow does not try to run the differential. It runs the parts that
# are cheap and still catch real regressions -- the GX decoder has already had
# one bug (CALL_DL consuming 1 byte instead of 9) that silently corrupted every
# figure downstream of it, and that bug is now a test here.
#
# The expensive jobs live in nightly.yml.
name: ci

on:
  # Every PR that targets main, and main itself after a merge.
  #
  # Both are scoped to main deliberately. Unscoped, a push to a feature branch
  # with an open PR fires BOTH events and every check runs twice -- which is
  # what was happening: duplicate entries for each job, doubling the work and
  # making it ambiguous which run a required-check rule is waiting on.
  #
  # Feature branches are still covered, because a PR against main is what
  # triggers the checks, and merging requires them (branch protection).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  decoder:
    name: GX decoder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decoder test suite
        working-directory: harness/src
        run: python3 test_decode.py

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: no oversized or forbidden files
        # Mirrors .githooks/pre-commit. The hook is opt-in (it only runs if the
        # contributor has core.hooksPath set), so the same rules are enforced
        # here where they cannot be skipped.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt $((25 * 1024 * 1024)) ]; then
              echo "BLOCKED: $f is $size bytes (limit 25 MB)"
              fail=1
            fi
            case "$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]')" in
              *.rvz|*.iso|*.wbfs|*.gcm|*.wia|*.ciso)
                echo "BLOCKED: $f — disc image"; fail=1 ;;
              *.sky)
                echo "BLOCKED: $f — Skylander figure dump"; fail=1 ;;
              *.fifolog|*.trace|*.ppctrace)
                echo "BLOCKED: $f — oracle trace, regenerate instead"; fail=1 ;;
            esac
          done < <(git ls-files)
          [ "$fail" -eq 0 ] && echo "clean"
          exit "$fail"

  commit-format:
    name: commit message sections
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: every commit carries the five required sections
        # docs/COMMIT_CONVENTION.md requires: what it is, caveats and risks,
        # design choices, why these and not the alternatives, what might go
        # wrong. Checked by section number so wording can vary.
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          fail=0
          # github.sha on a pull_request event is GitHub's SYNTHETIC MERGE
          # COMMIT ("Merge <head> into <base>"), not the PR head -- so walking
          # from it inspects a commit no contributor wrote and that by
          # construction has none of the required sections. The PR head is the
          # branch tip, and --no-merges keeps any real merge commits on the
          # branch out too, since those messages are generated as well.
          head="${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list --no-merges "$base..$head"); do
            body=$(git log -1 --format=%B "$sha")
            missing=""
            for n in 1 2 3 4 5; do
              printf '%s' "$body" | grep -qE "^$n\." || missing="$missing $n"
            done
            if [ -n "$missing" ]; then
              echo "commit $(git log -1 --format=%h\ %s "$sha")"
              echo "  missing section(s):$missing"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "all commits carry five sections"
          exit "$fail"
