# Do the Dolphin patches still apply?
#
# dolphin/ is not vendored -- it is cloned and patched -- so the patch set can
# rot without anything in this repo changing: upstream moves, a hunk stops
# applying, and the next person to set up a checkout finds out.
#
# This is split from ci.yml because it needs a Dolphin clone (a minute or two,
# against seconds for the rest), and scoped by `paths` so it only runs when the
# patches or the script that applies them change. Everyday PRs do not pay for
# it.
#
# It deliberately does NOT build. nightly.yml does that. The question here is
# narrower and much cheaper: do the patches still apply at all?
#
# The first nightly run failed in 48 seconds because patch 0003 targets SFML,
# which is a SUBMODULE, and the paths in it are relative to the submodule root.
# That had never been exercised because the patches had only ever been applied
# by hand. This job is that lesson made automatic.
name: patches

on:
  push:
    branches: [main]
    paths:
      - 'dolphin-web/patches/**'
      - 'scripts/apply-patches.sh'
      - '.github/workflows/patches.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dolphin-web/patches/**'
      - 'scripts/apply-patches.sh'
      - '.github/workflows/patches.yml'

jobs:
  apply:
    name: patches apply to a fresh Dolphin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: clone Dolphin
        # Only the submodules the patches actually touch.
        #
        # --recurse-submodules fetches roughly twenty of them and did not
        # finish inside twenty minutes, which is far too slow for a check that
        # runs on a pull request. Exactly one patch (0003) lands in a
        # submodule, so only that one is initialised.
        #
        # If a future patch targets another submodule, apply-patches.sh fails
        # with "directory does not exist" -- the same message as a missing
        # mapping, and the fix is to add the path in both places.
        run: |
          git clone --depth 1 https://github.com/dolphin-emu/dolphin.git dolphin
          git -C dolphin submodule update --init --depth 1 Externals/SFML/SFML

      - name: apply
        run: scripts/apply-patches.sh dolphin

      - name: applying twice is a no-op
        # The script reports an already-applied patch as skipped rather than
        # failing, because re-running setup on an existing checkout is routine.
        # If that ever regresses, a second run is where it shows.
        run: scripts/apply-patches.sh dolphin
