<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skylanders</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --fg: #d8dde6; --dim: #7c8596; --bad: #ff8a80; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column;
         align-items: center; gap: 12px; padding: 16px; }
  #screen { position: relative; width: min(100%, calc((100vh - 140px) * 640 / 528));
            aspect-ratio: 640 / 528; background: #000; }
  /* The canvas is 640x528 (the backend's surface); CSS scales it. */
  #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #screen:fullscreen { width: auto; height: 100%; }
  #status { position: absolute; inset: auto 0 0 0; margin: 0; padding: 10px 14px;
            background: rgb(0 0 0 / 0.7); }
  #status.failed { color: var(--bad); }
  #speed { position: absolute; top: 8px; right: 10px; font: 12px ui-monospace, monospace;
           color: var(--dim); }
  #bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center;
         color: var(--dim); max-width: 900px; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid #333a46; border-radius: 4px;
        padding: 1px 5px; color: var(--fg); }
  button { font: inherit; color: var(--fg); background: #1b2030; border: 1px solid #333a46;
           border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  #portal { width: min(100%, 900px); }
  #portal h2 { font-size: 14px; margin: 0 0 6px; color: var(--dim); font-weight: 600; }
  #portal ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #portal .slots { margin-bottom: 10px; }
  #portal .slots li { background: #1b2030; border: 1px solid #333a46; border-radius: 6px;
                      padding: 4px 4px 4px 10px; }
  #portal .slots button { padding: 2px 8px; margin-left: 6px; }
  #portal .empty { color: var(--dim); padding: 4px 0; }
  #portal .find { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  #portal input, #portal select { font: inherit; color: var(--fg); background: #1b2030;
                                  border: 1px solid #333a46; border-radius: 6px; padding: 4px 8px; }
  #portal input { flex: 1 1 180px; }
  #portal .figures { max-height: 160px; overflow: auto; }
  #portal .figures button { padding: 3px 10px; }
  #states { width: min(100%, 900px); }
  #states h2 { font-size: 14px; margin: 0 0 6px; color: var(--dim); font-weight: 600; }
  #states ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #states li { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  #states li button { padding: 2px 8px; }
  #states button:disabled { opacity: 0.4; cursor: default; }
  .state-status { margin: 6px 0 0; color: var(--dim); min-height: 1.4em; }
  #saves { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--dim);
           width: min(100%, 900px); }
  #saves[hidden] { display: none; }
  #saves-status { margin-right: auto; }
  #log { width: min(100%, 900px); max-height: 30vh; overflow: auto; margin: 0;
         font: 11px ui-monospace, monospace; color: var(--dim); }
</style>
<div id="screen">
  <canvas id="canvas" width="640" height="528"></canvas>
  <div id="speed"></div>
  <p id="status">Loading…</p>
</div>
<div id="bar">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> stick</span>
  <span><kbd>Space</kbd>/click A</span>
  <span><kbd>Shift</kbd>/right-click B</span>
  <span><kbd>E</kbd> C</span>
  <span><kbd>Q</kbd> Z</span>
  <span><kbd>R</kbd> shake</span>
  <span><kbd>T</kbd> push forward</span>
  <span><kbd>←↑↓→</kbd> D-pad</span>
  <span><kbd>Enter</kbd> +</span>
  <span><kbd>Backspace</kbd> −</span>
  <span><kbd>1</kbd><kbd>2</kbd></span>
  <span><kbd>H</kbd> Home</span>
  <span>mouse: pointer · gamepad works too</span>
  <button id="sound">Sound</button>
  <button id="fullscreen">Fullscreen</button>
</div>
<section id="portal" hidden></section>
<section id="states" hidden></section>
<div id="saves" hidden>
  <span id="saves-status"></span>
  <button id="saves-export">Export saves</button>
  <button id="saves-import">Import saves</button>
  <button id="saves-reset">Reset</button>
</div>
<button id="copy-log" hidden>Copy log</button>
<pre id="log" hidden></pre>
<script type="module" src="shell.js"></script>
</html>
